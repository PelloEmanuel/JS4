<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios con fetch y axios</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <header class="barra-superior">
    <div>
      <h1>Usuarios con fetch y axios</h1>
      <p>Ejercicio 1 · Datos de una API pública</p>
    </div>
    <div class="barra-acciones">
      <button id="btnTema" class="tema">Modo oscuro</button>
    </div>
  </header>

  <main class="pagina">
      <div class="columna">
        <section class="panel">
          <h2>Cargar usuarios</h2>
          <p class="info">Trae los usuarios de JSONPlaceholder con cada técnica.</p>
          <div class="acciones">
            <button id="btnFetch">Cargar con fetch</button>
            <button id="btnAxios">Cargar con axios</button>
          </div>
        </section>
      <section class="panel">
        <h2 id="tituloFormulario">Agregar usuario</h2>
        <form id="formulario" novalidate>
          <label for="inputNombre">Nombre</label>
          <input type="text" id="inputNombre" placeholder="Ej: Ana Pérez">
          <label for="inputEmail">Email</label>
          <input type="email" id="inputEmail" placeholder="ana@correo.com">
          <p id="errorForm" class="error-form"></p>
          <div class="acciones">
            <button type="submit" id="btnGuardar">Agregar</button>
            <button type="button" id="btnCancelarEdicion" class="secundario oculto">Cancelar edición</button>
          </div>
        </form>
      </section>
      </div>

      <section class="panel">
        <div class="encabezado-lista">
          <h2>Usuarios (nombre y email)</h2>
          <button id="btnBorrarTodos" class="peligro" disabled>Eliminar todos</button>
        </div>
        <p id="infoCarga" class="info"></p>
        <div id="lista" class="lista"></div>
      </section>
  </main>

  <div id="modal" class="modal-fondo oculto" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>Confirmar eliminación</h3>
      <p id="modalTexto"></p>
      <div class="acciones">
        <button id="btnCancelarBorrado" class="secundario">Cancelar</button>
        <button id="btnConfirmarBorrado" class="peligro">Eliminar</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/libs/axios.min.js"></script>
  <script src="/modules/script.js"></script>
</body>
</html>
